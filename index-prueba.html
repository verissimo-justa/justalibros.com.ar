<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>justa libros · relecturas</title>

    <!-- Open Graph (F6) -->
    <meta property="og:title" content="justa libros · relecturas">
    <meta property="og:description" content="Libros de segunda mano. Encontrá tu próxima relectura.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://justalibros.com.ar/">
    <meta property="og:image" content="https://justalibros.com.ar/og-image.jpg">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon.png">
    <link rel="apple-touch-icon" href="./favicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <script defer src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

    <style>
        /* ============================================================
           VARIABLES GLOBALES
           ============================================================ */
        :root {
            --fuente-principal: 'Inter', 'Roboto', 'Helvetica Neue', Helvetica, Arial, sans-serif;

            /* ---------- Paleta de marca ---------- */
            --azul-900: #001121;
            --azul-800: #001F3B;
            --azul-700: #002D55;
            --azul-600: #003B6F;
            --azul-500: #4C7BB3;
            --azul-400: #97B7D7;
            --azul-300: #E3EDF7;
            --azul-100: #F3F7FA;

            /* ---------- Fondos ---------- */
            --color-fondo:              var(--azul-100);
            --color-superficie:         #FFFFFF;
            --color-superficie-alt:     var(--azul-100);
            --color-portada-fondo:      var(--azul-300);

            /* ---------- Textos ---------- */
            --color-texto:              var(--azul-900);
            --color-texto-suave:        var(--azul-600);
            --color-texto-tenue:        var(--azul-500);
            --color-texto-placeholder:  var(--azul-500);

            /* ---------- Bordes ---------- */
            --color-borde:              var(--azul-300);
            --color-borde-input:        var(--azul-300);
            --color-borde-focus:        var(--azul-500);

            /* ---------- Primarios ---------- */
            --color-primario:           var(--azul-800);
            --color-primario-hover:     var(--azul-600);

            /* ---------- Portadas (fallback y gradientes) ---------- */
            --color-portada-accento:    var(--azul-500);
            --color-portada-grad-1:     var(--azul-100);
            --color-portada-grad-2:     var(--azul-300);

            /* ---------- Colores específicos de libros ---------- */
            --color-titulo-libro:       var(--azul-700);
            --color-autor-libro:        var(--azul-600);
            --color-link-hover:         var(--azul-400);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--fuente-principal);
            background: var(--color-fondo);
            color: var(--color-texto);
            padding: 0 20px;
        }

        /* ---------- Skip link (E7) ---------- */
        .skip-link {
            position: absolute;
            left: -9999px;
            top: 0;
            background: var(--color-primario);
            color: #ffffff;
            padding: 10px 16px;
            z-index: 9999;
            text-decoration: none;
            border-radius: 0 0 8px 0;
            font-weight: 600;
        }
        .skip-link:focus {
            left: 0;
        }

        /* ---------- Header ---------- */
        header {
            max-width: 1200px;
            margin: 40px auto 30px;
            text-align: left;
        }
        header h1 {
            font-size: 3rem;
            letter-spacing: -0.5px;
            line-height: 1.15;
            color: var(--color-texto);
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.28em;
            font-weight: 400;
        }
        header h1 .marca {
            font-weight: 400;
            letter-spacing: -0.8px;
            color: var(--azul-600);
        }
        header h1 .tagline {
            font-weight: 200;
            letter-spacing: -0.5px;
            color: var(--azul-600);
        }
        header h1 .icono-reciclado {
            width: 0.75em;
            height: 0.75em;
            flex-shrink: 0;
            opacity: 0.5;
            margin-left: 0.25em;
            margin-right: 0.25em;
            transform: translateY(0.10em);
        }
        header h1 .fila-2 {
            font-weight: 200;
            letter-spacing: -0.5px;
            color: var(--azul-600);
        }
        header h1 .fila-2 strong {
            font-weight: 300;
            color: var(--azul-600);
        }

        /* ---------- Panel de control ---------- */
        .panel-control {
            max-width: 1200px;
            margin: 0 auto 40px;
            background: var(--color-superficie);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--color-borde);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .panel-control input,
        .panel-control select {
            padding: 12px 16px;
            font-size: 1rem;
            border: 1px solid var(--color-borde-input);
            border-radius: 8px;
            background: var(--color-fondo);
            color: var(--color-texto);
            outline: none;
            flex: 1;
            min-width: 200px;
        }
        .panel-control input::placeholder { color: var(--color-texto-placeholder); }
        .panel-control input:focus,
        .panel-control select:focus {
            border-color: var(--color-borde-focus);
            background: var(--color-superficie);
        }

        /* Foco visible consistente (E3) */
        .panel-control input:focus-visible,
        .panel-control select:focus-visible,
        .pag-btn:focus-visible,
        .btn-comprar:focus-visible,
        .btn-cerrar:focus-visible,
        .btn-limpiar:focus-visible,
        .btn-volver-arriba:focus-visible {
            outline: 3px solid var(--color-borde-focus);
            outline-offset: 2px;
        }

        .contador-libros {
            width: 100%;
            font-size: 0.9rem;
            color: var(--color-texto-tenue);
            font-weight: 600;
            margin-bottom: -5px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* Botón limpiar filtros (F3) */
        .btn-limpiar {
            background: transparent;
            border: 1px solid var(--color-borde-input);
            color: var(--color-texto-suave);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
            margin-left: auto;
        }
        .btn-limpiar:hover {
            border-color: var(--color-borde-focus);
            color: var(--color-texto);
        }

        /* ---------- Grilla ---------- */
        .grilla {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto 40px;
        }

        /* ---------- Tarjeta ---------- */
        .tarjeta {
            background: var(--color-superficie);
            border-radius: 12px;
            border: 1px solid var(--color-borde);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .tarjeta:hover,
        .tarjeta:focus-visible {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0, 31, 59, 0.05);
            outline: none;
        }
        .tarjeta:focus-visible {
            outline: 3px solid var(--color-borde-focus);
            outline-offset: 2px;
        }
        .portada-contenedor {
            width: 100%;
            aspect-ratio: 4 / 5;
            background: var(--color-portada-fondo);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .portada-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: relative;
            z-index: 2;
        }
        .portada-fallback {
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            width: 100%;
            border-left: 12px solid var(--color-portada-accento);
            background: linear-gradient(135deg, var(--color-portada-grad-1), var(--color-portada-grad-2));
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .fallback-titulo { font-size: 1.1rem; font-weight: 700; color: var(--color-titulo-libro); line-height: 1.3; }
        .fallback-autor { font-size: 0.9rem; color: var(--color-autor-libro); font-weight: 500; }

        .info { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; }
        .info h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; line-height: 1.3; color: var(--color-titulo-libro); }
        .info .autor { font-size: 0.95rem; color: var(--color-autor-libro); margin-bottom: 8px; }
        .info .detalles {
            font-size: 0.85rem;
            color: var(--color-autor-libro);
            margin-top: 0.6em;
            margin-bottom: auto;
            line-height: 1.4;
        }

        /* Links dentro de autor y categoría */
        .info .autor a,
        .modal-info .autor a,
        .info .detalles a.categoria-link,
        .modal-detalles a.categoria-link {
            color: inherit;
            text-decoration: none;
            transition: color 0.2s;
        }
        .info .autor a:hover,
        .modal-info .autor a:hover,
        .info .detalles a.categoria-link:hover,
        .modal-detalles a.categoria-link:hover {
            color: var(--color-link-hover);
            text-decoration: none;
        }

        .footer-tarjeta {
            padding: 15px;
            background: var(--color-superficie-alt);
            border-top: 1px solid var(--color-borde);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .precio { font-size: 1.15rem; font-weight: 700; color: var(--color-texto); }
        .btn-comprar {
            background: var(--color-primario);
            color: #ffffff;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 600;
            transition: background 0.2s;
            border: none;
            cursor: pointer;
            font-family: inherit;
            display: inline-block;
        }
        .btn-comprar:hover { background: var(--color-primario-hover); }

        /* ---------- Modal ---------- */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 17, 33, 0.55);
            backdrop-filter: blur(4px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-contenido {
            background: var(--color-superficie);
            padding: 30px;
            border-radius: 16px;
            max-width: 700px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 20px 40px rgba(0, 17, 33, 0.15);
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }
        .btn-cerrar {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 1.8rem;
            background: none; border: none;
            color: var(--color-texto-tenue);
            cursor: pointer; outline: none;
        }
        .btn-cerrar:hover { color: var(--color-texto); }
        .modal-fotos img {
            width: 140px; height: 210px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid var(--color-borde);
            background: var(--color-portada-fondo);
            cursor: zoom-in;
        }
        .modal-info { flex: 12; min-width: 280px; display: flex; flex-direction: column; }
        .modal-info h2 { font-size: 1.6rem; margin-bottom: 5px; color: var(--color-titulo-libro); }
        .modal-info .autor { font-size: 1.1rem; color: var(--color-autor-libro); margin-bottom: 20px; }
        .modal-detalles { font-size: 0.95rem; color: var(--color-autor-libro); margin-bottom: 30px; line-height: 1.6; }
        .modal-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 15px;
            border-top: 1px solid var(--color-borde);
            gap: 10px;
            flex-wrap: wrap;
        }
        .modal-acciones {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .btn-secundario {
            background: transparent;
            border: 1px solid var(--color-borde-input);
            color: var(--color-texto-suave);
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
            text-decoration: none;
        }
        .btn-secundario:hover {
            border-color: var(--color-borde-focus);
            color: var(--color-texto);
        }

        .no-resultados {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            color: var(--color-texto-suave);
            font-size: 1.05rem;
            line-height: 1.6;
        }
        .no-resultados p + p { font-size: 0.9rem; color: var(--color-texto-tenue); margin-top: 8px; }
        .no-resultados .btn-comprar { margin-top: 20px; }

        /* ---------- Pop-up de imagen ampliada ---------- */
        .img-popup-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 17, 33, 0.85);
            backdrop-filter: blur(6px);
            z-index: 99999;
            justify-content: center;
            align-items: center;
            padding: 20px;
            cursor: zoom-out;
        }
        .img-popup-overlay.activo { display: flex; }
        .img-popup-overlay img {
            max-width: 90vw;
            max-height: 90vh;
            width: auto; height: auto;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 17, 33, 0.4);
            cursor: default;
            background: transparent;
            display: block;
        }

        /* ---------- Lupa sobre la imagen ampliada ---------- */
        #img-popup-src { cursor: crosshair; }
        #img-popup-src.lupa-activa { cursor: none; }
        .lupa-circular {
            position: fixed;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.85);
            box-shadow:
                0 0 0 2px rgba(0, 17, 33, 0.25),
                0 12px 30px rgba(0, 17, 33, 0.45);
            background-repeat: no-repeat;
            background-origin: border-box;
            pointer-events: none;
            z-index: 100000;
            display: none;
            overflow: hidden;
        }
        .lupa-circular.activa { display: block; }

        /* ---------- Paginación ---------- */
        .paginacion {
            max-width: 1200px;
            margin: 0 auto 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .paginacion-por-pagina {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: var(--color-texto-suave);
        }
        .paginacion-por-pagina label { font-weight: 500; }
        .paginacion-por-pagina select {
            padding: 8px 12px;
            font-size: 0.9rem;
            border: 1px solid var(--color-borde-input);
            border-radius: 8px;
            background: var(--color-superficie);
            color: var(--color-texto);
            cursor: pointer;
            outline: none;
            font-family: inherit;
        }
        .paginacion-por-pagina select:focus { border-color: var(--color-borde-focus); }
        .paginacion-controles {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .pag-btn {
            width: 38px; height: 38px;
            border-radius: 50%;
            border: 1px solid var(--color-borde);
            background: var(--color-superficie);
            color: var(--color-texto-suave);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        .pag-btn:hover:not(:disabled):not(.activa) {
            border-color: var(--color-borde-focus);
            color: var(--color-texto);
        }
        .pag-btn.activa {
            background: var(--color-primario);
            color: #ffffff;
            border-color: var(--color-primario);
            cursor: default;
        }
        .pag-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .pag-puntos {
            color: var(--color-texto-tenue);
            padding: 0 4px;
            user-select: none;
        }
        .paginacion-info {
            font-size: 0.85rem;
            color: var(--color-texto-tenue);
            min-width: 150px;
            text-align: right;
        }

        /* ---------- Botón volver arriba ---------- */
        .btn-volver-arriba {
            position: fixed;
            bottom: 30px; left: 30px;
            width: 48px; height: 48px;
            border-radius: 50%;
            background: rgba(0, 31, 59, 0.55);
            color: #ffffff;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s, background 0.2s, transform 0.2s;
            z-index: 90;
            font-family: inherit;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }
        .btn-volver-arriba.visible { opacity: 1; visibility: visible; }
        .btn-volver-arriba:hover {
            background: rgba(0, 31, 59, 0.85);
            transform: translateY(-3px);
        }

        /* ---------- Footer ---------- */
        .footer {
            max-width: 1200px;
            margin: 40px auto 40px;
            padding-top: 40px;
            border-top: 1px solid var(--color-borde);
            color: var(--color-texto-suave);
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .footer-inner {
            display: flex;
            justify-content: space-between;
            gap: 40px;
            flex-wrap: wrap;
            margin-bottom: 30px;
            align-items: flex-start;
        }

        .footer-marca,
        .footer-contacto {
            flex: 1 1 300px;
            min-width: 240px;
            max-width: 50%;
        }

        /* Logo del footer */
        .footer-logo {
            font-size: 1.5rem;
            font-weight: 500;
            letter-spacing: -0.5px;
            color: var(--color-texto);
            display: flex;
            flex-direction: row;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.25em;
            justify-content: flex-start;
        }
        .footer-logo .fila-1 {
            display: flex;
            align-items: baseline;
            gap: 0.3em;
        }
        .footer-logo .marca {
            font-weight: 400;
            letter-spacing: -0.6px;
            color: var(--azul-600);
        }
        .footer-logo .tagline-f {
            font-weight: 200;
            color: var(--azul-600);
        }
        .footer-logo .icono-reciclado {
            width: 0.75em;
            height: 0.75em;
            flex-shrink: 0;
            opacity: 0.5;
            margin-left: 0.15em;
            margin-right: 0.15em;
            transform: translateY(0.10em);
        }
        .footer-logo .fila-2 {
            font-weight: 200;
            color: var(--azul-600);
        }
        .footer-logo .fila-2 strong {
            font-weight: 300;
            color: var(--azul-600);
        }

        /* Contacto */
        .footer-titulo {
            font-size: 0.85rem;
            font-weight: 400;
            color: var(--color-texto-tenue);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }
        .footer-lista {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .footer-lista li {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .footer-lista svg {
            width: 16px;
            height: 16px;
            stroke: var(--color-texto-tenue);
            stroke-width: 1.5;
            fill: none;
            flex-shrink: 0;
        }
        .footer-lista a {
            color: var(--color-texto-suave);
            text-decoration: none;
            transition: color 0.2s;
        }
        .footer-lista a:hover {
            color: var(--color-texto);
        }
        .footer-copy {
            padding-top: 20px;
            border-top: 1px solid var(--color-borde);
            font-size: 0.8rem;
            color: var(--color-texto-tenue);
            text-align: center;
        }

        /* ---------- Skeleton de carga ---------- */
        .skeleton-tarjeta {
            background: var(--color-superficie);
            border-radius: 12px;
            border: 1px solid var(--color-borde);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .skeleton-portada {
            width: 100%;
            aspect-ratio: 4 / 5;
            background: linear-gradient(
                90deg,
                var(--color-portada-grad-1) 25%,
                var(--color-portada-grad-2) 50%,
                var(--color-portada-grad-1) 75%
            );
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite linear;
        }
        .skeleton-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .skeleton-linea {
            height: 12px;
            border-radius: 6px;
            background: linear-gradient(
                90deg,
                var(--color-portada-grad-1) 25%,
                var(--color-portada-grad-2) 50%,
                var(--color-portada-grad-1) 75%
            );
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite linear;
        }
        .skeleton-linea.corta   { width: 60%; }
        .skeleton-linea.media   { width: 80%; }
        .skeleton-linea.precio  { width: 35%; height: 16px; margin-top: 6px; }

        @keyframes shimmer {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ---------- Spinner junto al contador ---------- */
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid var(--color-borde-input);
            border-top-color: var(--color-borde-focus);

    <!-- Pop-up de imagen ampliada -->

    <!-- Lupa circular -->
    <div class="lupa-circular" id="lupa-circular"></div>

    <script>
        // ============================================================
        // CONFIGURACIÓN
        // ============================================================
        const URL_SHEETS_TSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRqiqbESbtl1SVOFo_7kDqXeqs7IcbzWjfdEjB3m0_d-3EOHRnI460qYc0nc97wEXbRGZriVz6RrWc_/pub?output=tsv';
        const ORDEN_ESTADOS = ['como nuevo', 'muy bueno', 'bueno', 'regular'];

        // Estado global
        let librosData = [];
        let librosFiltrados = [];
        let paginaActual = 1;
        let porPagina = 25;
        let semillaAleatoria = Math.random();
        let elementoFocoAnterior = null;

        // ============================================================
        // UTILIDADES
        // ============================================================
        const normalizar = (txt) => (txt || '')
            .toString()
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .toLowerCase()
            .trim();

	const esc = (txt) => (txt ?? '')
            .toString()
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');

	const tituloOrdenable = (titulo) => {
            const t = normalizar(titulo);
            return t.replace(/^(el|la|los|las|un|una|unos|unas|uno)\s+/i, '').trim();
            };

	const formatearPrecio = (precio) => {
            if (!precio) return '-';
            const num = parseInt(precio.toString().replace(/[^0-9]/g, ''), 10);
            return isNaN(num) ? precio : '$' + num.toLocaleString('es-AR');
            };

	const numeroDe = (valor, defaultVal = Infinity) => {
            const n = parseInt((valor || '').toString().replace(/[^0-9]/g, ''), 10);
            return isNaN(n) ? defaultVal : n;
            };

	const numeroPrecio = (p) => numeroDe(p);
	const numeroAnio   = (a) => numeroDe(a);
	const numeroId     = (id) => numeroDe(id, -Infinity);

	const cmp = (a, b) => (a === b ? 0 : (a < b ? -1 : 1));

	const placeholderSVG = (texto) => 'data:image/svg+xml;utf8,' + encodeURIComponent(
            `<svg xmlns="http://www.w3.org/2000/svg" width="140" height="210">
            <rect width="100%" height="100%" fill="#e8eef6"/>
            <text x="50%" y="50%" font-family="sans-serif" font-size="14" fill="#8a9bb5" text-anchor="middle">${esc(texto)}</text>
            </svg>`
);

	// Debounce: retrasa la ejecución hasta que pasen `delay` ms sin llamadas
	function debounce(fn, delay = 200) {
            let timerId;
            return (...args) => {
            clearTimeout(timerId);
            timerId = setTimeout(() => fn(...args), delay);
            };
}

        function enlaceCompra(libro) {
            const w = (libro.whatsapp || '').trim();
            if (!w) return '';
            if (/^https?:\/\//i.test(w)) return w;
            const digitos = w.replace(/\D/g, '');
            if (!digitos) return '';
            const msg = encodeURIComponent(`Hola! Me interesa el libro "${libro.titulo}" (código ${libro.id}).`);
            return `https://wa.me/${digitos}?text=${msg}`;
        }

        // ============================================================
        // SKELETON DE CARGA
        // ============================================================
        function mostrarSkeletons(cantidad = 8) {
            const grilla = document.getElementById('grilla-libros');
            grilla.innerHTML = '';
            const fragment = document.createDocumentFragment();
            for (let i = 0; i < cantidad; i++) {
                const sk = document.createElement('div');
                sk.className = 'skeleton-tarjeta';
                sk.innerHTML = `
                    <div class="skeleton-portada"></div>
                    <div class="skeleton-info">
                        <div class="skeleton-linea media"></div>
                        <div class="skeleton-linea corta"></div>
                        <div class="skeleton-linea precio"></div>
                    </div>
                `;
                fragment.appendChild(sk);
            }
            grilla.appendChild(fragment);
        }

        // ============================================================
        // CARGA DEL CATÁLOGO
        // ============================================================
        async function cargarCatalogo() {
            const contador = document.getElementById('contador-texto');
            contador.innerHTML = '<span class="spinner"></span>Cargando estantes...';
            mostrarSkeletons(8);

            try {
                if (typeof Papa === 'undefined') {
                    throw new Error('No se cargó la librería PapaParse (¿sin conexión o CDN bloqueada?)');
                }

                const respuesta = await fetch(URL_SHEETS_TSV, { cache: 'no-store' });
                if (!respuesta.ok) throw new Error('HTTP ' + respuesta.status);

                const texto = await respuesta.text();
                librosData = interpretarCSV(texto);

                if (librosData.length === 0) {
                    document.getElementById('grilla-libros').innerHTML = '';
                    contador.innerText = 'Catálogo vacío o formato no reconocido.';
                    return;
                }

                semillaAleatoria = Math.random();
                popularFiltros(librosData);
                filtrarCatalogo();

                // Título dinámico con la cantidad
                document.title = `justa libros · ${librosData.length} disponibles`;

                // Params de la URL: priorizamos id > autor > categoría
                const params = new URLSearchParams(location.search);
                const idBuscado = params.get('id');
                const autorBuscado = params.get('autor');
                const catBuscada = params.get('categoria');

                if (idBuscado) {
                    const libro = librosData.find(l => l.id === idBuscado);
                    if (libro) abrirModal(libro);
                } else if (autorBuscado) {
                    document.getElementById('buscador').value = autorBuscado;
                    filtrarCatalogo();
                } else if (catBuscada) {
                    document.getElementById('filtro-categoria').value = catBuscada;
                    filtrarCatalogo();
                }

            } catch (error) {
                console.error('Error en la carga:', error);
                contador.innerText = 'Error al conectar con el archivo de libros.';
                document.getElementById('grilla-libros').innerHTML =
                    `<div class="no-resultados">No se pudo cargar el catálogo. Recargá la página o intentá más tarde.</div>`;
            }
        }

        // ============================================================
        // PARSER CSV
        // ============================================================
        function interpretarCSV(texto) {
            const limpio = texto.replace(/^\uFEFF/, '').replace(/\r/g, '').trim();
            if (!limpio) return [];

            const parsed = Papa.parse(limpio, {
                header: true,
                skipEmptyLines: true,
                delimiter: '\t',
                transformHeader: h => normalizar(h).replace(/[\s_]+/g, '')
            });

            return parsed.data
                .map(r => ({
                    id:             (r.id || '').toString().trim(),
                    titulo:         (r.titulo || '').toString().trim(),
                    autorN:         (r.autorn || '').toString().trim(),
                    autorA:         (r.autora || '').toString().trim(),
                    editorial:      (r.editorial || '').toString().trim(),
                    anio:           (r.anio || '').toString().trim(),
                    categoria1:     (r.categoria1 || r.categoria || '').toString().trim(),
                    categoria2:     (r.categoria2 || r.subcategoria || '').toString().trim(),
                    estado:         (r.estado || '').toString().trim(),
                    precio:         (r.precio || '').toString().trim(),
                    whatsapp:       (r.whatsapp || '').toString().trim(),
                    disponibilidad: (r.disponibilidad || '').toString().trim()
                }))
                .map(l => ({
                    ...l,
                    autor: [l.autorN, l.autorA].filter(Boolean).join(' ')
                }))
                .filter(l =>
                    l.titulo &&
                    l.id &&
                    normalizar(l.disponibilidad) !== 'vendido'
                );
        }

        // ============================================================
        // FILTROS DINÁMICOS
        // ============================================================
        function popularFiltros(libros) {
            const selCat = document.getElementById('filtro-categoria');
            const selEst = document.getElementById('filtro-estado');

            // --- Categorías ---
            const categoriasMap = new Map();
            libros.forEach(l => {
                [l.categoria1, l.categoria2].forEach(c => {
                    if (!c) return;
                    const key = normalizar(c);
                    if (key && !categoriasMap.has(key)) {
                        categoriasMap.set(key, c);
                    }
                });
            });
            [...categoriasMap.entries()]
                .sort((a, b) => a[1].localeCompare(b[1], 'es'))
                .forEach(([key, etiqueta]) => {
                    const opt = document.createElement('option');
                    opt.value = key;
                    opt.textContent = etiqueta;
                    selCat.appendChild(opt);
                });

            // --- Estados (orden personalizado) ---
            const estadosMap = new Map();
            libros.forEach(l => {
                if (!l.estado) return;
                const key = normalizar(l.estado);
                if (key && !estadosMap.has(key)) {
                    estadosMap.set(key, l.estado);
                }
            });
            [...estadosMap.entries()]
                .sort((a, b) => {
                    const ia = ORDEN_ESTADOS.indexOf(a[0]);
                    const ib = ORDEN_ESTADOS.indexOf(b[0]);
                    if (ia === -1 && ib === -1) return a[1].localeCompare(b[1], 'es');
                    if (ia === -1) return 1;
                    if (ib === -1) return -1;
                    return ia - ib;
                })
                .forEach(([key, etiqueta]) => {
                    const opt = document.createElement('option');
                    opt.value = key;
                    opt.textContent = etiqueta;
                    selEst.appendChild(opt);
                });
        }

        // ============================================================
        // RENDER DE TARJETAS
        // ============================================================
        function renderizarLibros(libros) {
            const grilla = document.getElementById('grilla-libros');
            const contador = document.getElementById('contador-texto');
            grilla.innerHTML = '';

            const totalCatalogo = librosData.length;
            const totalFiltrado = librosFiltrados.length;

            const hayFiltros =
                !!document.getElementById('buscador').value.trim() ||
                !!document.getElementById('filtro-categoria').value ||
                !!document.getElementById('filtro-estado').value;

            actualizarBotonLimpiar(hayFiltros);

            if (libros.length === 0) {
                grilla.innerHTML = `
                    <div class="no-resultados">
                        <p>No encontramos libros con esos filtros.</p>
                        <p>Probá quitar algún filtro, revisar la ortografía o buscar por editorial.</p>
                        <button type="button" class="btn-comprar" onclick="limpiarFiltros()">Limpiar filtros</button>
                    </div>`;
                contador.innerText = hayFiltros
                    ? `0 resultados de ${totalCatalogo} libros en el catálogo`
                    : '0 libros disponibles';
                return;
            }

            if (hayFiltros) {
                contador.innerText = totalFiltrado === 1
                    ? `1 resultado de ${totalCatalogo} libros en el catálogo`
                    : `${totalFiltrado} resultados de ${totalCatalogo} libros en el catálogo`;
            } else {
                contador.innerText = totalCatalogo === 1
                    ? '1 libro de segunda mano disponible en este momento'
                    : `${totalCatalogo} libros de segunda mano disponibles en este momento`;
            }

            const fragment = document.createDocumentFragment();

            libros.forEach(libro => {
                const tarjeta = document.createElement('div');
                tarjeta.className = 'tarjeta';
                tarjeta.tabIndex = 0;
                tarjeta.setAttribute('role', 'button');
                tarjeta.setAttribute('aria-label', `${libro.titulo} — ${libro.autor}`);
                tarjeta.onclick = () => abrirModal(libro);
                tarjeta.onkeydown = (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        abrirModal(libro);
                    }
                };

                const tituloEsc = esc(libro.titulo);
                const autorEsc = esc(libro.autor);
                const editorialEsc = esc(libro.editorial) || '-';
                const estadoEsc = esc(libro.estado) || '-';
                const catLink = libro.categoria1
                    ? `<br><strong>Categoría:</strong> <a href="#" class="categoria-link" data-categoria="${esc(normalizar(libro.categoria1))}">${esc(libro.categoria1)}</a>`
                    : '';

                tarjeta.innerHTML = `
                    <div class="portada-contenedor">
                        <div class="portada-fallback">
                            <div class="fallback-titulo">${tituloEsc}</div>
                            <div class="fallback-autor">${autorEsc}</div>
                        </div>
                        <img class="portada-img" src="./img/${encodeURIComponent(libro.id)}-tapa.jpg" alt="${tituloEsc}" loading="lazy"
                             onload="this.previousElementSibling.style.display='none'"
                             onerror="this.style.display='none'">
                    </div>
                    <div class="info">
                        <h2>${tituloEsc}</h2>
                        <p class="autor">
                            <a href="#" class="autor-link" data-autor="${autorEsc}">${autorEsc}</a>
                        </p>
                        <div class="detalles">
                            <strong>Editorial:</strong> ${editorialEsc}<br>
                            <strong>Estado:</strong> ${estadoEsc}${catLink}
                        </div>
                    </div>
                    <div class="footer-tarjeta">
                        <span class="precio">${esc(formatearPrecio(libro.precio))}</span>
                        <span class="btn-comprar">Ver ficha</span>
                    </div>
                `;
                fragment.appendChild(tarjeta);
            });

            grilla.appendChild(fragment);
        }

        // ============================================================
        // MODAL DE FICHA (E2 + E4 + F1)
        // ============================================================
        function abrirModal(libro) {
            elementoFocoAnterior = document.activeElement;

            document.getElementById('modal-titulo').innerText = libro.titulo;

            const modalAutor = document.getElementById('modal-autor');
            modalAutor.innerHTML = libro.autor
                ? `<a href="#" class="autor-link" data-autor="${esc(libro.autor)}">${esc(libro.autor)}</a>`
                : '';

            document.getElementById('modal-precio').innerText = formatearPrecio(libro.precio);

            const btn = document.getElementById('modal-btn-comprar');
            const enlace = enlaceCompra(libro);
            btn.href = enlace || '#';
            btn.style.display = enlace ? 'inline-block' : 'none';

            const cat1HTML = libro.categoria1
                ? `<a href="#" class="categoria-link" data-categoria="${esc(normalizar(libro.categoria1))}">${esc(libro.categoria1)}</a>`
                : '-';

            const cat2HTML = libro.categoria2
                ? `<a href="#" class="categoria-link" data-categoria="${esc(normalizar(libro.categoria2))}">${esc(libro.categoria2)}</a>`
                : '-';

            document.getElementById('modal-txt-detalles').innerHTML = `
                <p><strong>Editorial:</strong> ${esc(libro.editorial) || 'No especificada'}</p>
                <p><strong>Año de edición:</strong> ${esc(libro.anio) || '-'}</p>
                <p><strong>Categoría principal:</strong> ${cat1HTML}</p>
                <p><strong>Subcategoría:</strong> ${cat2HTML}</p>
                <p><strong>Estado de conservación:</strong> ${esc(libro.estado) || '-'}</p>
            `;

            const tapa = document.getElementById('modal-tapa');
            const contra = document.getElementById('modal-contratapa');
            const idSeguro = encodeURIComponent(libro.id);

            tapa.alt = `Tapa de "${libro.titulo}" de ${libro.autor}`;
            contra.alt = `Contratapa de "${libro.titulo}"`;

            tapa.onerror = function() {
                this.onerror = null;
                this.src = placeholderSVG('Sin Tapa');
            };
            contra.onerror = function() {
                this.onerror = null;
                this.src = placeholderSVG('Sin Contratapa');
            };

            tapa.src = `./img/${idSeguro}-tapa.jpg`;
            contra.src = `./img/${idSeguro}-contratapa.jpg`;

            history.replaceState(null, '', `?id=${encodeURIComponent(libro.id)}`);

            document.getElementById('modal-libro').style.display = 'flex';
            document.body.style.overflow = 'hidden';

            setTimeout(() => {
                const cerrar = document.querySelector('#modal-libro .btn-cerrar');
                if (cerrar) cerrar.focus();
            }, 50);
        }

        function cerrarModal() {
            const modal = document.getElementById('modal-libro');
            if (modal.style.display !== 'flex') return;

            modal.style.display = 'none';
            document.body.style.overflow = '';

            history.replaceState(null, '', location.pathname);

            if (elementoFocoAnterior && elementoFocoAnterior.focus) {
                elementoFocoAnterior.focus();
                elementoFocoAnterior = null;
            }
        }

        // ============================================================
        // FILTRO + ORDEN
        // ============================================================
        function filtrarCatalogo() {
            const busqueda        = normalizar(document.getElementById('buscador').value);
            const catSeleccionada = document.getElementById('filtro-categoria').value;
            const estSeleccionado = document.getElementById('filtro-estado').value;
            const criterio        = document.getElementById('ordenar-por').value;

            const filtrados = librosData.filter(libro => {
                const titulo    = normalizar(libro.titulo);
                const autor     = normalizar(libro.autor);
                const editorial = normalizar(libro.editorial);

                const coincideTexto = !busqueda ||
                    titulo.includes(busqueda) ||
                    autor.includes(busqueda) ||
                    editorial.includes(busqueda);

                const coincideCategoria = !catSeleccionada ||
                    normalizar(libro.categoria1) === catSeleccionada ||
                    normalizar(libro.categoria2) === catSeleccionada;

                const coincideEstado = !estSeleccionado ||
                    normalizar(libro.estado) === estSeleccionado;

                return coincideTexto && coincideCategoria && coincideEstado;
            });

            librosFiltrados = aplicarOrden(filtrados, criterio);
            paginaActual = 1;
            renderizarPaginaActual();
        }

        // ============================================================
        // APLICAR FILTRO + REFRESCAR (unifica autor, categoría y limpiar)
        // ============================================================
        function aplicarFiltroYRefrescar({
            buscador = '',
            categoria = '',
            estado = '',
            orden = '',
            urlParam = null
        } = {}) {
            document.getElementById('buscador').value = buscador;
            document.getElementById('filtro-categoria').value = categoria;
            document.getElementById('filtro-estado').value = estado;
            document.getElementById('ordenar-por').value = orden;

            cerrarModal();
            filtrarCatalogo();

            if (urlParam) {
                history.replaceState(null, '', urlParam);
            }

            document.getElementById('grilla-libros')
                .scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function filtrarPorAutor(autor) {
            if (!autor) return;
            aplicarFiltroYRefrescar({
                buscador: autor,
                urlParam: `?autor=${encodeURIComponent(autor)}`
            });
        }

        function filtrarPorCategoria(categoriaKey) {
            if (!categoriaKey) return;
            aplicarFiltroYRefrescar({
                categoria: categoriaKey,
                urlParam: `?categoria=${encodeURIComponent(categoriaKey)}`
            });
        }

        function limpiarFiltros() {
            aplicarFiltroYRefrescar();
        }

        function actualizarBotonLimpiar(hayFiltros) {
            const btn = document.getElementById('btn-limpiar');
            if (!btn) return;
            btn.style.display = hayFiltros ? 'inline-block' : 'none';
        }

        // ============================================================
        // PAGINACIÓN
        // ============================================================
        function renderizarPaginaActual() {
            const total = librosFiltrados.length;

            if (total === 0) {
                renderizarLibros([]);
                document.getElementById('paginacion').style.display = 'none';
                return;
            }

            const porPag = porPagina === 0 ? total : porPagina;
            const totalPaginas = Math.max(1, Math.ceil(total / porPag));

            if (paginaActual > totalPaginas) paginaActual = totalPaginas;
            if (paginaActual < 1) paginaActual = 1;

            const inicio = (paginaActual - 1) * porPag;
            const fin = Math.min(paginaActual * porPag, total);
            const pagina = librosFiltrados.slice(inicio, fin);

            renderizarLibros(pagina);
            renderizarControlesPaginacion(totalPaginas, inicio, fin, total);
        }

        function renderizarControlesPaginacion(totalPaginas, inicio, fin, total) {
            const contenedor = document.getElementById('paginacion');
            const controles = document.getElementById('paginacion-controles');
            const info = document.getElementById('paginacion-info');

            controles.innerHTML = '';
            info.textContent = `Mostrando ${inicio + 1}–${fin} de ${total}`;

            const mostrarControles = totalPaginas > 1 && porPagina !== 0;
            contenedor.style.display = 'flex';
            controles.style.display = mostrarControles ? 'flex' : 'none';

            if (!mostrarControles) return;

            const btnPrev = document.createElement('button');
            btnPrev.className = 'pag-btn';
            btnPrev.innerHTML = '‹';
            btnPrev.setAttribute('aria-label', 'Página anterior');
            btnPrev.disabled = paginaActual === 1;
            btnPrev.onclick = () => irAPagina(paginaActual - 1);
            controles.appendChild(btnPrev);

            const paginas = calcularPaginas(totalPaginas, paginaActual, 5);
            paginas.forEach(p => {
                if (p === '...') {
                    const span = document.createElement('span');
                    span.className = 'pag-puntos';
                    span.textContent = '…';
                    controles.appendChild(span);
                } else {
                    const btn = document.createElement('button');
                    btn.className = 'pag-btn' + (p === paginaActual ? ' activa' : '');
                    btn.textContent = p;
                    btn.setAttribute('aria-label', `Ir a página ${p}`);
                    if (p === paginaActual) btn.setAttribute('aria-current', 'page');
                    btn.onclick = () => irAPagina(p);
                    controles.appendChild(btn);
                }
            });

            const btnNext = document.createElement('button');
            btnNext.className = 'pag-btn';
            btnNext.innerHTML = '›';
            btnNext.setAttribute('aria-label', 'Página siguiente');
            btnNext.disabled = paginaActual === totalPaginas;
            btnNext.onclick = () => irAPagina(paginaActual + 1);
            controles.appendChild(btnNext);
        }

        function calcularPaginas(total, actual, maxVisibles) {
            const paginas = [];
            if (total <= maxVisibles) {
                for (let i = 1; i <= total; i++) paginas.push(i);
                return paginas;
            }

            paginas.push(1);
            const rango = maxVisibles - 2;
            let desde = Math.max(2, actual - Math.floor(rango / 2));
            let hasta = Math.min(total - 1, desde + rango - 1);
            if (hasta - desde + 1 < rango) desde = Math.max(2, hasta - rango + 1);

            if (desde > 2) paginas.push('...');
            for (let i = desde; i <= hasta; i++) paginas.push(i);
            if (hasta < total - 1) paginas.push('...');
            paginas.push(total);

            return paginas;
        }

        function irAPagina(n) {
            paginaActual = n;
            renderizarPaginaActual();
            document.getElementById('grilla-libros').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // ============================================================
        // ORDENAMIENTO
        // ============================================================
        function crearRandom(seed) {
            let a = Math.floor(seed * 4294967296) >>> 0;
            return function () {
                a |= 0;
                a = (a + 0x6D2B79F5) | 0;
                let t = Math.imul(a ^ (a >>> 15), 1 | a);
                t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }

        function aplicarOrden(libros, criterio) {
            const copia = [...libros];

            if (!criterio) {
                copia.sort((a, b) => cmp(numeroId(b.id), numeroId(a.id)));
                return copia;
            }

            switch (criterio) {
                case 'titulo-asc':
                    copia.sort((a, b) =>
                        cmp(tituloOrdenable(a.titulo), tituloOrdenable(b.titulo)) ||
                        cmp(normalizar(a.titulo), normalizar(b.titulo))
                    );
                    break;

                case 'autor-asc':
                    copia.sort((a, b) =>
                        cmp(normalizar(a.autorA), normalizar(b.autorA)) ||
                        cmp(normalizar(a.autorN), normalizar(b.autorN))
                    );
                    break;

                case 'precio-asc':
                    copia.sort((a, b) => cmp(numeroPrecio(a.precio), numeroPrecio(b.precio)));
                    break;

                case 'precio-desc':
                    copia.sort((a, b) => {
                        const pa = numeroPrecio(a.precio), pb = numeroPrecio(b.precio);
                        if (pa === Infinity && pb === Infinity) return 0;
                        if (pa === Infinity) return 1;
                        if (pb === Infinity) return -1;
                        return pb - pa;
                    });
                    break;

                case 'recientes':
                    copia.sort((a, b) => cmp(numeroId(b.id), numeroId(a.id)));
                    break;

                case 'antiguos':
                    copia.sort((a, b) => cmp(numeroId(a.id), numeroId(b.id)));
                    break;

                case 'anio-asc':
                    copia.sort((a, b) => cmp(numeroAnio(a.anio), numeroAnio(b.anio)));
                    break;

                case 'anio-desc':
                    copia.sort((a, b) => {
                        const aa = numeroAnio(a.anio), ab = numeroAnio(b.anio);
                        if (aa === Infinity && ab === Infinity) return 0;
                        if (aa === Infinity) return 1;
                        if (ab === Infinity) return -1;
                        return ab - aa;
                    });
                    break;

                case 'aleatorio': {
                    const rnd = crearRandom(semillaAleatoria);
                    for (let i = copia.length - 1; i > 0; i--) {
                        const j = Math.floor(rnd() * (i + 1));
                        [copia[i], copia[j]] = [copia[j], copia[i]];
                    }
                    break;
                }
            }

            return copia;
        }
        // ============================================================
        // POP-UP DE IMAGEN AMPLIADA
        // ============================================================
        function abrirPopupImagen(src, alt) {
            const overlay = document.getElementById('img-popup');
            const img = document.getElementById('img-popup-src');
            img.src = src;
            img.alt = alt || '';
            overlay.classList.add('activo');
        }

        function cerrarPopupImagen() {
            const overlay = document.getElementById('img-popup');
            const img = document.getElementById('img-popup-src');
            overlay.classList.remove('activo');
            if (window.desactivarLupa) window.desactivarLupa();
            setTimeout(() => {
                if (!overlay.classList.contains('activo')) {
                    img.removeAttribute('src');
                    img.removeAttribute('alt');
                }
            }, 200);
        }

        // ============================================================
        // LUPA CIRCULAR SOBRE LA IMAGEN AMPLIADA
        // ============================================================
        (() => {
            const lupa = document.getElementById('lupa-circular');
            const popupImg = document.getElementById('img-popup-src');

            const ZOOM = 1.9;
            let lupaSize = 320;
            let lupaRadio = lupaSize / 2;

            function activar(clientX, clientY) {
                if (!popupImg.src || popupImg.src.startsWith('data:')) return;
                if (!popupImg.complete || popupImg.naturalWidth === 0) return;

                lupaSize = Math.min(320, window.innerWidth - 20);
                lupaRadio = lupaSize / 2;
                lupa.style.width = lupaSize + 'px';
                lupa.style.height = lupaSize + 'px';

                lupa.style.backgroundImage = `url("${popupImg.src}")`;

                const rect = popupImg.getBoundingClientRect();
                lupa.style.backgroundSize = `${rect.width * ZOOM}px ${rect.height * ZOOM}px`;

                lupa.classList.add('activa');
                popupImg.classList.add('lupa-activa');
                mover(clientX, clientY);
            }

            function mover(clientX, clientY) {
                if (!lupa.classList.contains('activa')) return;

                const rect = popupImg.getBoundingClientRect();
                const relX = (clientX - rect.left) / rect.width;
                const relY = (clientY - rect.top) / rect.height;

                let lx = clientX - lupaRadio;
                let ly = clientY - lupaRadio;

                if (lx < 0) lx = 0;
                if (ly < 0) ly = 0;
                if (lx + lupaSize > window.innerWidth) lx = window.innerWidth - lupaSize;
                if (ly + lupaSize > window.innerHeight) ly = window.innerHeight - lupaSize;

                lupa.style.left = lx + 'px';
                lupa.style.top = ly + 'px';

                const bgW = rect.width * ZOOM;
                const bgH = rect.height * ZOOM;
                const bgX = -(relX * bgW - (clientX - lx));
                const bgY = -(relY * bgH - (clientY - ly));
                lupa.style.backgroundPosition = `${bgX}px ${bgY}px`;
            }

            function desactivar() {
                lupa.classList.remove('activa');
                popupImg.classList.remove('lupa-activa');
            }

            window.desactivarLupa = desactivar;

            popupImg.addEventListener('mouseenter', (e) => activar(e.clientX, e.clientY));
            popupImg.addEventListener('mousemove',  (e) => mover(e.clientX, e.clientY));
            popupImg.addEventListener('mouseleave', desactivar);

            popupImg.addEventListener('touchstart', (e) => {
                if (e.touches.length !== 1) return;
                e.preventDefault();
                const t = e.touches[0];
                activar(t.clientX, t.clientY);
            }, { passive: false });

            popupImg.addEventListener('touchmove', (e) => {
                if (e.touches.length !== 1) return;
                e.preventDefault();
                const t = e.touches[0];
                mover(t.clientX, t.clientY);
            }, { passive: false });

            popupImg.addEventListener('touchend', (e) => {
                if (e.touches.length === 0) desactivar();
            });

            popupImg.addEventListener('touchcancel', desactivar);
        })();

        // ============================================================
        // EVENTOS
        // ============================================================

        // Buscador: debounce de 200ms (no filtra en cada tecla)
        document.getElementById('buscador')
            .addEventListener('input', debounce(filtrarCatalogo, 200));

        // Selects de categoría y estado: cambio inmediato
        ['filtro-categoria', 'filtro-estado'].forEach(id => {
            document.getElementById(id).addEventListener('change', filtrarCatalogo);
        });

        // Selector de orden (maneja la semilla del aleatorio)
        document.getElementById('ordenar-por').addEventListener('change', (e) => {
            if (e.target.value === 'aleatorio') {
                semillaAleatoria = Math.random();
            }
            filtrarCatalogo();
        });

        // Delegación: filtrar por autor o categoría al clickear sus links
        document.addEventListener('click', (e) => {
            const linkAutor = e.target.closest('.autor-link');
            if (linkAutor) {
                e.preventDefault();
                e.stopPropagation();
                filtrarPorAutor(linkAutor.dataset.autor);
                return;
            }

            const linkCat = e.target.closest('.categoria-link');
            if (linkCat) {
                e.preventDefault();
                e.stopPropagation();
                filtrarPorCategoria(linkCat.dataset.categoria);
                return;
            }
        });

        // Escape: cierra popup de imagen o modal
        document.addEventListener('keydown', (e) => {
            if (e.key !== 'Escape') return;
            if (document.getElementById('img-popup').classList.contains('activo')) {
                cerrarPopupImagen();
            } else {
                cerrarModal();
            }
        });

        // Tab atrapado dentro del modal
        document.getElementById('modal-libro').addEventListener('keydown', (e) => {
            if (e.key !== 'Tab') return;
            const modal = e.currentTarget;
            const focusables = modal.querySelectorAll(
                'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
            );
            if (focusables.length === 0) return;
            const primero = focusables[0];
            const ultimo = focusables[focusables.length - 1];

            if (e.shiftKey && document.activeElement === primero) {
                e.preventDefault();
                ultimo.focus();
            } else if (!e.shiftKey && document.activeElement === ultimo) {
                e.preventDefault();
                primero.focus();
            }
        });

        // Click en tapa / contratapa del modal abre el popup
        ['modal-tapa', 'modal-contratapa'].forEach(id => {
            const img = document.getElementById(id);
            img.addEventListener('click', (e) => {
                e.stopPropagation();
                if (img.src && !img.src.startsWith('data:')) {
                    abrirPopupImagen(img.src, img.alt);
                }
            });
        });

        // Botón "Copiar link" del modal
        document.getElementById('btn-copiar-link').addEventListener('click', async (e) => {
            e.stopPropagation();
            const btn = e.currentTarget;
            const textoOriginal = btn.textContent;
            try {
                await navigator.clipboard.writeText(location.href);
                btn.textContent = '¡Copiado!';
            } catch (err) {
                btn.textContent = 'No se pudo copiar';
            }
            setTimeout(() => { btn.textContent = textoOriginal; }, 1500);
        });

        // Selector "por página"
        document.getElementById('por-pagina').addEventListener('change', (e) => {
            porPagina = parseInt(e.target.value, 10);
            paginaActual = 1;
            renderizarPaginaActual();
        });

        // Botón "volver arriba"
        const btnVolverArriba = document.getElementById('btn-volver-arriba');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) {
                btnVolverArriba.classList.add('visible');
            } else {
                btnVolverArriba.classList.remove('visible');
            }
        });
        btnVolverArriba.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // Año de copyright
        document.getElementById('anio-copyright').textContent = new Date().getFullYear();

        // ============================================================
        // INICIO
        // ============================================================
        window.addEventListener('DOMContentLoaded', cargarCatalogo);
    </script>
</body>
