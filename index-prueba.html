<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>justa. libros que buscan relecturas</title>

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon.png">
    <link rel="apple-touch-icon" href="./favicon.png">

    <!-- Tipografía -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- Librerías -->
    <script defer src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

    <style>
        /* ============================================================
           VARIABLES GLOBALES
           ============================================================ */
        :root {
            --fuente-principal: 'Inter', 'Roboto', 'Helvetica Neue', Helvetica, Arial, sans-serif;

            --color-fondo:              #f4f7fb;
            --color-superficie:         #ffffff;
            --color-superficie-alt:     #f8fafd;
            --color-portada-fondo:      #e8eef6;

            --color-texto:              #1a1f2b;
            --color-texto-suave:        #6a7480;
            --color-texto-tenue:        #9ba3af;
            --color-texto-placeholder:  #8a94a0;

            --color-borde:              #e2e8f0;
            --color-borde-input:        #d5dde8;
            --color-borde-focus:        #7d93b3;

            --color-primario:           #1a1f2b;
            --color-primario-hover:     #2b3444;

            --color-portada-accento:    #8a9bb5;
            --color-portada-grad-1:     #f4f7fb;
            --color-portada-grad-2:     #dde6f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--fuente-principal);
            background: var(--color-fondo);
            color: var(--color-texto);
            padding: 0 20px;
        }

        /* ---------- Header ---------- */
        header {
            max-width: 1200px;
            margin: 40px auto 20px;
            text-align: left;
        }
        header h1 {
            font-family: var(--fuente-principal);
            font-size: 3rem;
            font-weight: 500;
            letter-spacing: -0.5px;
            line-height: 1.15;
            color: var(--color-texto);
        }
        header h1 .punto { font-weight: 700; }
        header h1 .tagline {
            font-weight: 200;
            font-size: 2.7rem;
            color: var(--color-texto);
        }

        /* ---------- Panel de control ---------- */
        .panel-control {
            max-width: 1200px;
            margin: 0 auto 40px;
            background: var(--color-superficie);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--color-borde);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .panel-control input,
        .panel-control select {
            padding: 12px 16px;
            font-size: 1rem;
            border: 1px solid var(--color-borde-input);
            border-radius: 8px;
            background: var(--color-fondo);
            color: var(--color-texto);
            outline: none;
            flex: 1;
            min-width: 200px;
        }
        .panel-control input::placeholder { color: var(--color-texto-placeholder); }
        .panel-control input:focus,
        .panel-control select:focus {
            border-color: var(--color-borde-focus);
            background: var(--color-superficie);
        }
        .contador-libros {
            width: 100%;
            font-size: 0.9rem;
            color: var(--color-texto-tenue);
            font-weight: 600;
            margin-bottom: -5px;
        }

        /* ---------- Grilla ---------- */
        .grilla {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto 40px;
        }

        /* ---------- Tarjeta ---------- */
        .tarjeta {
            background: var(--color-superficie);
            border-radius: 12px;
            border: 1px solid var(--color-borde);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .tarjeta:hover,
        .tarjeta:focus-visible {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(26, 31, 43, 0.05);
            outline: none;
        }
        .portada-contenedor {
            width: 100%;
            aspect-ratio: 4 / 5;
            background: var(--color-portada-fondo);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .portada-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: relative;
            z-index: 2;
        }
        .portada-fallback {
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            width: 100%;
            border-left: 12px solid var(--color-portada-accento);
            background: linear-gradient(135deg, var(--color-portada-grad-1), var(--color-portada-grad-2));
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .fallback-titulo { font-size: 1.1rem; font-weight: 700; color: var(--color-texto); line-height: 1.3; }
        .fallback-autor { font-size: 0.9rem; color: var(--color-portada-accento); font-weight: 500; }

        .info { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; }
        .info h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; line-height: 1.3; }
        .info .autor { font-size: 0.95rem; color: var(--color-texto-suave); margin-bottom: 8px; }
        .info .detalles { font-size: 0.8rem; color: var(--color-texto-tenue); margin-bottom: auto; line-height: 1.4; }

        .footer-tarjeta {
            padding: 15px;
            background: var(--color-superficie-alt);
            border-top: 1px solid var(--color-borde);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .precio { font-size: 1.15rem; font-weight: 700; color: var(--color-texto); }
        .btn-comprar {
            background: var(--color-primario);
            color: #ffffff;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn-comprar:hover { background: var(--color-primario-hover); }

        /* ---------- Modal ---------- */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(26, 31, 43, 0.55);
            backdrop-filter: blur(4px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-contenido {
            background: var(--color-superficie);
            padding: 30px;
            border-radius: 16px;
            max-width: 700px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 20px 40px rgba(26, 31, 43, 0.15);
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }
        .btn-cerrar {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 1.8rem;
            background: none; border: none;
            color: var(--color-texto-tenue);
            cursor: pointer; outline: none;
        }
        .modal-fotos img {
            width: 140px; height: 210px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid var(--color-borde);
            background: var(--color-portada-fondo);
            cursor: zoom-in;
        }
        .modal-info { flex: 12; min-width: 280px; display: flex; flex-direction: column; }
        .modal-info h2 { font-size: 1.6rem; margin-bottom: 5px; }
        .modal-info .autor { font-size: 1.1rem; color: var(--color-texto-suave); margin-bottom: 20px; }
        .modal-detalles { font-size: 0.95rem; color: var(--color-texto); margin-bottom: 30px; line-height: 1.6; }
        .modal-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 15px;
            border-top: 1px solid var(--color-borde);
        }

        .no-resultados {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            color: var(--color-texto-suave);
            font-size: 1.2rem;
        }

        /* ---------- Pop-up de imagen ampliada ---------- */
        .img-popup-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(26, 31, 43, 0.85);
            backdrop-filter: blur(6px);
            z-index: 99999;
            justify-content: center;
            align-items: center;
            padding: 20px;
            cursor: zoom-out;
        }
        .img-popup-overlay.activo { display: flex; }
        .img-popup-overlay img {
            max-width: 90vw;
            max-height: 90vh;
            width: auto; height: auto;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(26, 31, 43, 0.4);
            cursor: default;
            background: transparent;
            display: block;
        }

        /* ---------- Lupa sobre la imagen ampliada ---------- */
        #img-popup-src { cursor: crosshair; }
        #img-popup-src.lupa-activa { cursor: none; }
        .lupa-circular {
            position: fixed;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.85);
            box-shadow:
                0 0 0 2px rgba(26, 31, 43, 0.25),
                0 12px 30px rgba(26, 31, 43, 0.45);
            background-repeat: no-repeat;
            background-origin: border-box;
            pointer-events: none;
            z-index: 100000;
            display: none;
            overflow: hidden;
        }
        .lupa-circular.activa { display: block; }

        /* ---------- Paginación ---------- */
        .paginacion {
            max-width: 1200px;
            margin: 0 auto 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .paginacion-por-pagina {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: var(--color-texto-suave);
        }
        .paginacion-por-pagina label { font-weight: 500; }
        .paginacion-por-pagina select {
            padding: 8px 12px;
            font-size: 0.9rem;
            border: 1px solid var(--color-borde-input);
            border-radius: 8px;
            background: var(--color-superficie);
            color: var(--color-texto);
            cursor: pointer;
            outline: none;
            font-family: inherit;
        }
        .paginacion-por-pagina select:focus { border-color: var(--color-borde-focus); }
        .paginacion-controles {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .pag-btn {
            width: 38px; height: 38px;
            border-radius: 50%;
            border: 1px solid var(--color-borde);
            background: var(--color-superficie);
            color: var(--color-texto-suave);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        .pag-btn:hover:not(:disabled):not(.activa) {
            border-color: var(--color-borde-focus);
            color: var(--color-texto);
        }
        .pag-btn.activa {
            background: var(--color-primario);
            color: #ffffff;
            border-color: var(--color-primario);
            cursor: default;
        }
        .pag-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .pag-puntos {
            color: var(--color-texto-tenue);
            padding: 0 4px;
            user-select: none;
        }
        .paginacion-info {
            font-size: 0.85rem;
            color: var(--color-texto-tenue);
            min-width: 150px;
            text-align: right;
        }

        /* ---------- Botón volver arriba ---------- */
        .btn-volver-arriba {
            position: fixed;
            bottom: 30px; left: 30px;
            width: 48px; height: 48px;
            border-radius: 50%;
            background: rgba(26, 31, 43, 0.55);
            color: #ffffff;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s, background 0.2s, transform 0.2s;
            z-index: 90;
            font-family: inherit;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }
        .btn-volver-arriba.visible { opacity: 1; visibility: visible; }
        .btn-volver-arriba:hover {
            background: rgba(26, 31, 43, 0.85);
            transform: translateY(-3px);
        }

        /* ---------- Footer ---------- */
        .footer {
            max-width: 1200px;
            margin: 40px auto 40px;
            padding-top: 40px;
            border-top: 1px solid var(--color-borde);
            color: var(--color-texto-suave);
            font-size: 0.9rem;
            line-height: 1.6;
        }
        .footer-inner {
            display: flex;
            justify-content: space-between;
            gap: 40px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .footer-marca { flex: 1; min-width: 240px; }
        .footer-logo {
            font-size: 1.5rem;
            font-weight: 500;
            letter-spacing: -0.5px;
            color: var(--color-texto);
            margin-bottom: 4px;
        }
        .footer-logo .punto { font-weight: 700; }
        .footer-tagline {
            font-weight: 300;
            font-size: 1rem;
            color: var(--color-texto-suave);
        }
        .footer-contacto { flex: 1; min-width: 240px; }
        .footer-titulo {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--color-texto-tenue);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }
        .footer-lista {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .footer-lista li {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .footer-lista svg {
            width: 16px; height: 16px;
            stroke: var(--color-texto-tenue);
            stroke-width: 1.5;
            fill: none;
            flex-shrink: 0;
        }
        .footer-lista a {
            color: var(--color-texto-suave);
            text-decoration: none;
            transition: color 0.2s;
        }
        .footer-lista a:hover {
            color: var(--color-texto);
            text-decoration: underline;
        }
        .footer-copy {
            padding-top: 20px;
            border-top: 1px solid var(--color-borde);
            font-size: 0.8rem;
            color: var(--color-texto-tenue);
            text-align: center;
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 700px) {
            header { padding-left: 6px; }
            header h1 { font-size: 1.6rem; }
            header h1 .tagline {
                display: block;
                margin-top: 4px;
                font-size: 1.3rem;
            }
            .precio { font-size: 1.25rem; }
            .btn-comprar {
                font-size: 1.1rem;
                padding: 10px 16px;
            }
            .modal-contenido { padding: 22px; }

            .paginacion {
                justify-content: center;
                text-align: center;
            }
            .paginacion-info {
                min-width: auto;
                text-align: center;
                width: 100%;
                order: 3;
            }
            .footer-inner {
                flex-direction: column;
                gap: 25px;
            }
            .btn-volver-arriba {
                bottom: 20px;
                left: 20px;
                width: 44px;
                height: 44px;
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>justa<span class="punto">.</span> <span class="tagline">libros que buscan relecturas</span></h1>
    </header>

    <div class="panel-control">
        <div class="contador-libros" id="contador">Cargando estantes...</div>
        <input type="text" id="buscador" placeholder="Buscar por título, autor o editorial...">
        <select id="filtro-categoria">

        </select>
        <select id="filtro-estado">
            <option value="">Todos los estados</option>
        </select>
        <select id="ordenar-por">

            <option value="autor-asc">Autor (A-Z)</option>
            <option value="precio-asc">Precio (de menor a mayor)</option>
            <option value="precio-desc">Precio (de mayor a menor)</option>
            <option value="recientes">Últimos cargados</option>
            <option value="antiguos">Primeros cargados</option>
            <option value="anio-asc">Año de edición (ascendente)</option>
            <option value="anio-desc">Año de edición (descendente)</option>
            <option value="aleatorio">Aleatoriamente</option>
        </select>
    </div>

    <div class="grilla" id="grilla-libros"></div>

    <!-- Paginación -->
    <div class="paginacion" id="paginacion" style="display: none;">
        <div class="paginacion-por-pagina">
            <label for="por-pagina">Mostrar:</label>
            <select id="por-pagina">
                <option value="25">25</option>
                <option value="50">50</option>
                <option value="0">Todos</option>
            </select>
        </div>
        <div class="paginacion-controles" id="paginacion-controles"></div>
        <div class="paginacion-info" id="paginacion-info"></div>

    <!-- Footer -->
    <footer class="footer">

    <!-- Botón volver arriba -->
    <button type="button" class="btn-volver-arriba" id="btn-volver-arriba" aria-label="Volver arriba">↑</button>

    <!-- Modal de ficha del libro -->
    <div class="modal" id="modal-libro" onclick="if(event.target === this) cerrarModal()">
        <div class="modal-contenido">
            <button class="btn-cerrar" onclick="cerrarModal()" aria-label="Cerrar">&times;</button>
            <div class="modal-fotos">
                <img id="modal-tapa" src="" alt="Tapa" title="Ampliar imagen">
                <img id="modal-contratapa" src="" alt="Contratapa" title="Ampliar imagen">
            </div>
            <div class="modal-info">
                <h2 id="modal-titulo"></h2>
                <div class="autor" id="modal-autor"></div>
                <div class="modal-detalles" id="modal-txt-detalles"></div>
                <div class="modal-footer">
                    <span class="precio" id="modal-precio"></span>
                    <a href="" id="modal-btn-comprar" target="_blank" rel="noopener" class="btn-comprar">Comprar</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Pop-up de imagen ampliada -->
    <div class="img-popup-overlay" id="img-popup" onclick="cerrarPopupImagen()">
        <img id="img-popup-src" src="" alt="" onclick="event.stopPropagation()">
    </div>

    <!-- Lupa circular -->
    <div class="lupa-circular" id="lupa-circular"></div>

    <script>
        // ============================================================
        // CONFIGURACIÓN
        // ============================================================
        const URL_SHEETS_TSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRqiqbESbtl1SVOFo_7kDqXeqs7IcbzWjfdEjB3m0_d-3EOHRnI460qYc0nc97wEXbRGZriVz6RrWc_/pub?output=tsv';
        const ORDEN_ESTADOS = ['como nuevo', 'muy bueno', 'bueno', 'regular'];

        // Estado global
        let librosData = [];

        // Estado de paginación
        let librosFiltrados = [];
        let paginaActual = 1;
        let porPagina = 25;

        // ============================================================
        // UTILIDADES
        // ============================================================
        const normalizar = (txt) => (txt || '')
            .toString()
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .toLowerCase()
            .trim();

        // Escapa HTML para evitar inyección en innerHTML
        const esc = (txt) => (txt ?? '')
            .toString()
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');

        // Devuelve el título sin artículos iniciales (el, la, los, las, un, una...)
        const tituloOrdenable = (titulo) => {
            const t = normalizar(titulo);
            return t.replace(/^(el|la|los|las|un|una|unos|unas|uno)\s+/i, '').trim();
        };

        const formatearPrecio = (precio) => {
            if (!precio) return '-';
            const num = parseInt(precio.toString().replace(/[^0-9]/g, ''), 10);
            return isNaN(num) ? precio : '$' + num.toLocaleString('es-AR');
        };

        const numeroPrecio = (p) => {
            const n = parseInt((p || '').toString().replace(/[^0-9]/g, ''), 10);
            return isNaN(n) ? Infinity : n;
        };

        const numeroAnio = (a) => {
            const n = parseInt((a || '').toString().replace(/[^0-9]/g, ''), 10);
            return isNaN(n) ? Infinity : n;
        };

        const numeroId = (id) => {
            const n = parseInt((id || '').toString().replace(/[^0-9]/g, ''), 10);
            return isNaN(n) ? -Infinity : n;
        };

        // Comparador seguro: Infinity - Infinity da NaN y deja el orden indefinido.
        const cmp = (a, b) => (a === b ? 0 : (a < b ? -1 : 1));

        const placeholderSVG = (texto) => 'data:image/svg+xml;utf8,' + encodeURIComponent(
            `<svg xmlns="http://www.w3.org/2000/svg" width="140" height="210">
                <rect width="100%" height="100%" fill="#e8eef6"/>
                <text x="50%" y="50%" font-family="sans-serif" font-size="14" fill="#8a9bb5" text-anchor="middle">${esc(texto)}</text>
            </svg>`
        );

        // Acepta un link completo (https://wa.me/...) o solo el número de teléfono.
        function enlaceCompra(libro) {
            const w = (libro.whatsapp || '').trim();
            if (!w) return '';
            if (/^https?:\/\//i.test(w)) return w;
            const digitos = w.replace(/\D/g, '');
            if (!digitos) return '';
            const msg = encodeURIComponent(`Hola! Me interesa el libro "${libro.titulo}" (código ${libro.id}).`);
            return `https://wa.me/${digitos}?text=${msg}`;
        }

        // ============================================================
        // CARGA DEL CATÁLOGO
        // ============================================================
        async function cargarCatalogo() {
            const contador = document.getElementById('contador');
            try {
                if (typeof Papa === 'undefined') {
                    throw new Error('No se cargó la librería PapaParse (¿sin conexión o CDN bloqueada?)');
                }

                const respuesta = await fetch(URL_SHEETS_TSV);
                if (!respuesta.ok) throw new Error('HTTP ' + respuesta.status);

                const texto = await respuesta.text();
                librosData = interpretarCSV(texto);

                if (librosData.length === 0) {
                    contador.innerText = 'Catálogo vacío o formato no reconocido.';
                    return;
                }

                popularFiltros(librosData);
                filtrarCatalogo();
            } catch (error) {
                console.error('Error en la carga:', error);
                contador.innerText = 'Error al conectar con el archivo de libros.';
                document.getElementById('grilla-libros').innerHTML =
                    `<div class="no-resultados">No se pudo cargar el catálogo. Recargá la página o intentá más tarde.</div>`;
            }
        }

        // ============================================================
        // PARSER CSV
        // NOTA: transformHeader quita espacios Y guiones bajos, así
        // "autor_n" -> "autorn" y "ID_Tapa" -> "idtapa". Sin esto, los
        // campos con guión bajo no se leían (bug del autor vacío).
        // ============================================================
        function interpretarCSV(texto) {
            const limpio = texto.replace(/^\uFEFF/, '').replace(/\r/g, '').trim();
            if (!limpio) return [];

            const parsed = Papa.parse(limpio, {
                header: true,
                skipEmptyLines: true,
                delimiter: '\t',
                transformHeader: h => normalizar(h).replace(/[\s_]+/g, '')
            });

            return parsed.data
                .map(r => ({
                    id:             (r.id || '').toString().trim(),
                    titulo:         (r.titulo || '').toString().trim(),
                    autorN:         (r.autorn || '').toString().trim(),
                    autorA:         (r.autora || '').toString().trim(),
                    editorial:      (r.editorial || '').toString().trim(),
                    anio:           (r.anio || '').toString().trim(),
                    categoria1:     (r.categoria1 || r.categoria || '').toString().trim(),
                    categoria2:     (r.categoria2 || r.subcategoria || '').toString().trim(),
                    estado:         (r.estado || '').toString().trim(),
                    precio:         (r.precio || '').toString().trim(),
                    whatsapp:       (r.whatsapp || '').toString().trim(),
                    disponibilidad: (r.disponibilidad || '').toString().trim()
                }))
                .map(l => ({
                    ...l,
                    autor: [l.autorN, l.autorA].filter(Boolean).join(' ')
                }))
                .filter(l =>
                    l.titulo &&
                    l.id &&
                    normalizar(l.disponibilidad) !== 'vendido'
                );
        }
