<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Justa Libros | Catálogo en construcción</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Figtree', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #fcfbf7; /* Un fondo color papel/hueso muy sutil */
            color: #2c2520; /* Texto marrón oscuro/café */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .contenedor {
            text-align: center;
            max-width: 500px;
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(44, 37, 32, 0.05);
            border: 1px solid #eae6df;
        }
        .icono {
            font-size: 4rem;
            margin-bottom: 20px;
            display: inline-block;
            animation: flotar 3s ease-in-out infinite;
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
            color: #1a1512;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #655950;
            margin-bottom: 30px;
        }
        .badge {
            background-color: #f0ebe1;
            color: #7d6e61;
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            display: inline-block;
        }
        @keyframes flotar {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <span class="icono">📚</span>
        <h1>JUSTA libros</h1>
        <p>Estamos ordenando los estantes.</p> 
        <p>Muy pronto vas a poder recorrer nuestro catálogo online de más de 500 libros usados.</p>
        <span class="badge">Próximamente</span>
    </div>

</body>
</html>
